[tools]
node = "24.19.0"
pnpm = "11.19.0"

[tasks.install]
run = "pnpm install --frozen-lockfile"
[tasks.dev]
run = "pnpm dev"
[tasks."dev:wifi"]
run = "pnpm dev:wifi"
[tasks.build]
run = "pnpm build"
[tasks.test]
run = "pnpm test"
[tasks.preview]
run = "pnpm preview"

[tasks."check:assets"]
run = "pnpm check:assets"

[tasks."build:pages"]
run = "pnpm build:pages"
